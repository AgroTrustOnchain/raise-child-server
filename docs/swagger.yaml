basePath: /
definitions:
  entities.BankProfile:
    properties:
      bank_code:
        type: string
      bank_org:
        type: string
      created_at:
        type: string
      id:
        type: string
      owner:
        type: string
      owner_name:
        type: string
      payos_api_key:
        type: string
      payos_check_sum_key:
        type: string
      payos_client_id:
        type: string
      updated_at:
        type: string
    type: object
  entities.RegistrationRequest:
    properties:
      approvers:
        items:
          type: string
        type: array
      avatar_blob_id:
        type: string
      closed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      identity_card_blob_id:
        type: string
      identity_code:
        type: string
      is_confirm_register:
        description: Default as false, when status aprroved, user clicks to update
          to true, call smart contract to register role
        type: boolean
      last_name:
        type: string
      phone_number:
        type: string
      refuse_reasons:
        items:
          type: string
        type: array
      refusers:
        items:
          type: string
        type: array
      region:
        type: string
      register_role:
        type: string
      status:
        description: e.g. "Pending", "Approved", "Refused"
        type: string
      updated_at:
        type: string
    type: object
  entities.UploadChildRequest:
    properties:
      approvers:
        items:
          type: string
        type: array
      avatar_blob_id:
        type: string
      closed_at:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      identity_code:
        type: string
      is_confirm_upload:
        description: Default as false, when status aprroved, user clicks to update
          to true, call smart contract to register role
        type: boolean
      last_name:
        type: string
      refuse_reasons:
        items:
          type: string
        type: array
      refusers:
        items:
          type: string
        type: array
      region:
        type: string
      status:
        description: e.g. "Pending", "Approved", "Refused"
        type: string
      updated_at:
        type: string
    required:
    - avatar_blob_id
    - date_of_birth
    - first_name
    - gender
    - last_name
    - region
    type: object
  request.AddChildStringMetadaRequest:
    properties:
      key:
        type: string
      value:
        type: string
    required:
    - key
    - value
    type: object
  request.CreateBankProfileRequest:
    properties:
      bank_code:
        type: string
      bank_org:
        type: string
      owner_name:
        type: string
      payos_api_key:
        type: string
      payos_check_sum_key:
        type: string
      payos_client_id:
        type: string
    required:
    - bank_code
    - bank_org
    - owner_name
    type: object
  request.CreateRegistrationRequest:
    properties:
      avatar_blob_id:
        type: string
      identity_card_blob_id:
        type: string
      region:
        type: string
      register_role:
        type: string
    required:
    - avatar_blob_id
    - identity_card_blob_id
    - region
    - register_role
    type: object
  request.CreateWithdrawProposalRequest:
    properties:
      description:
        type: string
      pool_id:
        type: string
      withdraw_amount:
        maximum: 20000000
        minimum: 10000
        type: integer
    required:
    - pool_id
    - withdraw_amount
    type: object
  request.DonateRequest:
    properties:
      amount:
        minimum: 2000
        type: integer
      message:
        type: string
      pool_id:
        type: string
    required:
    - amount
    - pool_id
    type: object
  request.ExecuteTransactionRequest:
    properties:
      signature:
        type: string
      tx_bytes:
        type: string
    required:
    - signature
    - tx_bytes
    type: object
  request.LoginRequestV2:
    properties:
      address:
        type: string
      sub:
        type: string
    required:
    - address
    - sub
    type: object
  request.MoneyActionRequest:
    properties:
      action_type:
        description: '"donate" || "withdraw"'
        type: string
      amoun:
        minimum: 1
        type: integer
      coin_type:
        description: e.g. "SUI", "USDC"
        type: string
      message:
        type: string
      sender:
        type: string
    required:
    - action_type
    - amoun
    - sender
    type: object
  request.UpdateBankProfileRequest:
    properties:
      bank_code:
        type: string
      bank_org:
        type: string
      owner_name:
        type: string
      payos_api_key:
        type: string
      payos_check_sum_key:
        type: string
      payos_client_id:
        type: string
    type: object
  request.UploadChildRequest:
    properties:
      avatar_blob_id:
        type: string
      date_of_birth:
        type: string
      first_name:
        type: string
      gender:
        type: string
      identity_code:
        type: string
      last_name:
        type: string
      region:
        type: string
    required:
    - avatar_blob_id
    - date_of_birth
    - first_name
    - gender
    - identity_code
    - last_name
    - region
    type: object
  request.UploadProfileRequest:
    properties:
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      identity_code:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
      region:
        type: string
    required:
    - date_of_birth
    - email
    - first_name
    - gender
    - identity_code
    - last_name
    - phone_number
    - region
    type: object
  request.VoteRequest:
    properties:
      is_vote_yes:
        type: boolean
      refuse_reason:
        type: string
    required:
    - is_vote_yes
    type: object
  response.BankProfileResponse:
    properties:
      bank_code:
        type: string
      bank_org:
        type: string
      id:
        type: string
      owner:
        type: string
      owner_name:
        type: string
    type: object
  response.BuildTransactionResponse:
    properties:
      tx_bytes:
        type: string
    type: object
  response.ChildResponse:
    properties:
      avatar_blob_id:
        type: string
      date_of_birth:
        type: string
      dynamic_fields:
        items:
          type: string
        type: array
      dynamic_values:
        additionalProperties: true
        type: object
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      identity_code:
        type: string
      image_blob_ids:
        items:
          type: string
        type: array
      last_name:
        type: string
      region:
        type: string
      updated_at:
        type: string
      upload_image_periods:
        items:
          type: string
        type: array
      uploaded_at:
        type: string
    type: object
  response.MessageAPIResponse:
    properties:
      message:
        type: string
    type: object
  response.PaginationDataResponse:
    properties:
      data: {}
      page:
        type: integer
      total_pages:
        type: integer
    type: object
  response.PersonalProfileResponse:
    properties:
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      identity_code:
        type: string
      last_name:
        type: string
      phone_number:
        type: string
    type: object
  response.RegionsResponse:
    properties:
      regions:
        items:
          type: string
        type: array
    type: object
  response.SponsorResponse:
    properties:
      contributions:
        items:
          $ref: '#/definitions/response.TransactionResponse'
        type: array
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
      phone_number:
        type: string
      url:
        type: string
    type: object
  response.StaffNftResponse:
    properties:
      first_name:
        type: string
      id:
        type: string
      identity_code:
        type: string
      last_name:
        type: string
      name:
        type: string
      role:
        type: string
      url:
        type: string
    type: object
  response.StaffResponse:
    properties:
      avatar_blob_id:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      first_name:
        type: string
      gender:
        type: string
      id:
        type: string
      identity_code:
        type: string
      last_name:
        type: string
      nfts:
        items:
          $ref: '#/definitions/response.StaffNftResponse'
        type: array
      phone_number:
        type: string
      region:
        type: string
      string:
        type: string
      uploaded_at:
        type: string
      user:
        type: string
    type: object
  response.TransactionResponse:
    properties:
      action_type:
        description: e.g., "Deposit", "Withdraw"
        type: string
      actor_address:
        type: string
      amount:
        type: integer
      coin_type:
        description: e.g., "Sui", "USDC"
        type: string
      created_at:
        type: string
      id:
        type: string
      message:
        type: string
      pool_name:
        type: string
    type: object
  response.WithDrawProposalResponse:
    properties:
      approve_weight:
        type: integer
      approved_periods:
        items:
          type: string
        type: array
      approvers:
        items:
          type: string
        type: array
      closed_at:
        type: string
      created_at:
        type: string
      creator:
        type: string
      description:
        type: string
      id:
        type: string
      is_executed:
        type: boolean
      is_from_local_pool:
        type: boolean
      pool_name:
        type: string
      refuse_reasons:
        items:
          type: string
        type: array
      refuse_weight:
        type: integer
      refused_periods:
        items:
          type: string
        type: array
      refusers:
        items:
          type: string
        type: array
      updated_at:
        type: string
      withdraw_amount:
        type: integer
    type: object
host: locahost:8080
info:
  contact: {}
  description: API for RaiseChild Server
  title: RaiseChild Server API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns access tokens/session data
      parameters:
      - description: Login credentials (e.g., address and sub)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.LoginRequestV2'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: User login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the session for the specified user address
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "401":
          description: You have no rights to access this action.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /auth/nonce/{address}:
    get:
      consumes:
      - application/json
      description: Retrieves a unique nonce for the user to sign
      parameters:
      - description: User wallet address
        in: path
        name: address
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get login nonce
      tags:
      - auth
  /auth/salt/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves a unique salt for the user to login
      parameters:
      - description: User sub
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get wallet salt
      tags:
      - auth
  /banks:
    post:
      consumes:
      - application/json
      description: Submit bank details to create a new profile in the system
      parameters:
      - description: Bank Profile Creation Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateBankProfileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entities.BankProfile'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "401":
          description: You have no rights to access this action.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Create a new bank profile
      tags:
      - banks
  /banks/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed bank profile information using the bank's owner
        wallet
      parameters:
      - description: Wallet address
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BankProfileResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get bank profile owned by a wallet
      tags:
      - banks
    put:
      consumes:
      - application/json
      description: Modify the details of an existing bank profile by its ID
      parameters:
      - description: Bank Profile ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated Bank Profile Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateBankProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entities.BankProfile'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "401":
          description: You have no rights to access this action.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Update an existing bank profile
      tags:
      - banks
  /child-upload-reqs:
    get:
      consumes:
      - application/json
      description: Retrieve a list of child upload requests based on query parameters.
      parameters:
      - in: query
        name: gender
        type: string
      - in: query
        name: is_closed
        type: boolean
      - in: query
        name: keyword
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: region
        type: string
      - in: query
        name: sort_order
        type: string
      - in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginationDataResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get upload-child requests
      tags:
      - Child Upload Request
    post:
      consumes:
      - application/json
      description: Submit a JSON payload to create a new child upload request in the
        system.
      parameters:
      - description: Upload-child request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UploadChildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entities.UploadChildRequest'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Create a new upload-child request
      tags:
      - Child Upload Request
  /child-upload-reqs/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve the full details of a single upload-child request by its
        unique ID
      parameters:
      - description: Upload-child Request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginationDataResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get upload-child request details
      tags:
      - Child Upload Request
  /child-upload-reqs/{id}/confirm:
    post:
      consumes:
      - application/json
      description: Prepares and builds a transaction for registering new child information
        on-chain
      parameters:
      - description: UploadChild Request ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.BuildTransactionResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "401":
          description: You have no rights to access this action.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Confirm and store a child information to Sui Blockhain
      tags:
      - Child Upload Request
  /child-upload-reqs/{id}/vote:
    post:
      consumes:
      - application/json
      description: Submit an approval or refusal vote for a specific child upload
        request using its ID.
      parameters:
      - description: Upload Child Request ID
        in: path
        name: id
        required: true
        type: string
      - description: Voting details (e.g., vote type, comments)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.VoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      security:
      - BearerAuth: []
      summary: Vote on an upload-child request
      tags:
      - Child Upload Request
  /child-upload-reqs/user/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve child upload requests associated with a specific wallet
        and page number.
      parameters:
      - description: Wallet address
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Page number for pagination
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginationDataResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: Get upload-child requests by a wallet
      tags:
      - Child Upload Request
  /children:
    get:
      consumes:
      - application/json
      description: Retrieves a list of children based on filter criteria
      parameters:
      - in: query
        name: gender
        type: string
      - in: query
        name: keyword
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: region
        type: string
      - in: query
        name: sort_order
        type: string
      - in: query
        name: year_of_birth
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginationDataResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
          description: There is something wrong in the system during the process.
            Please try again later.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
      summary: List children
      tags:
      - children
    post:
      consumes:
      - application/json
      description: Prepares and builds a transaction for uploading new child information
        (e.g., "height", "weight") on-chain
      parameters:
      - description: 'Child Information (e.g. '
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UploadChildRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.BuildTransactionResponse'
        "400":
          description: Invalid data. Please try again.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "401":
          description: You have no rights to access this action.
          schema:
            $ref: '#/definitions/response.MessageAPIResponse'
        "500":
